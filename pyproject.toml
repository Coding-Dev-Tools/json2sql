[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "json2sql-cli"
version = "0.1.1"
description = "Convert JSON files/datasets to SQL INSERT statements"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Revenue Holdings"}]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]
keywords = ["json", "sql", "etl", "data-conversion", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/Coding-Dev-Tools/json2sql"
Documentation = "https://coding-dev-tools.github.io/json2sql/"
Repository = "https://github.com/Coding-Dev-Tools/json2sql"
Issues = "https://github.com/Coding-Dev-Tools/json2sql/issues"
Changelog = "https://github.com/Coding-Dev-Tools/json2sql/releases"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
]
license = ["revenueholdings-license>=0.1.0"]

[project.scripts]
json2sql = "json2sql.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["*"]
